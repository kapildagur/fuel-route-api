[project]
name = "fuel-route-api"
version = "0.1.0"
description = "Django API that plans the cheapest fuel stops for a truck route across the USA."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fuel-route-api contributors" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18",
    "drf-spectacular>=0.29",
    "gunicorn>=23.0",
    "httpx>=0.28",
    "numpy>=2.1",
    "python-dotenv>=1.1",
    "scipy>=1.15",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs>=3.16",
    "hypothesis>=6.130",
    "import-linter>=2.3",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.2",
    "pytest-django>=4.11",
    "ruff>=0.12",
    "scipy-stubs>=1.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuelroute"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter's trailing-comma handling
    "CPY001",  # the LICENSE file covers every file; no per-file copyright header
    "D106",    # Django's inner Meta classes are configuration, not API
    "D203",    # incompatible with D211; the project puts no blank line before a class docstring
    "D213",    # incompatible with D212; summaries start on the first docstring line
    "ISC001",  # conflicts with the formatter's implicit string concatenation handling
    "RUF012",  # Django and DRF declare class-level mutable attributes such as Meta.fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",        # test names are sentences about behaviour; docstrings would repeat them
    "EM101",    # fakes raise inline messages to simulate failures
    "PLR2004",  # tests compare against literal expected values
    "S101",     # pytest uses assert
    "S105",     # test settings use fixed, fake secrets
    "SLF001",   # tests may inspect private helpers of the module under test
    "TRY003",   # fakes raise inline messages to simulate failures
]
"src/fuelroute/stations/migrations/**" = [
    "D",  # migrations are generated by Django
]
"manage.py" = [
    "D",  # standard Django entry point
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "fuelroute.stations.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "fuelroute.settings"

# ---------------------------------------------------------------- pyright (editor only)
# mypy with the django-stubs plugin is the type gate. Pyright cannot run that plugin, so
# in strict mode it reports every Django model field as partly unknown; standard mode
# keeps the real errors visible in the editor.
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--benchmark-disable",
    "-ra",
]
filterwarnings = ["error"]
markers = [
    "unit: logic in isolation; set from the tests/unit directory",
    "integration: Django and adapters in process; set from the tests/integration directory",
    "e2e: real server over the network and the command line as a subprocess",
    "live: calls the real OpenRouteService API; needs ORS_API_KEY",
    "benchmark: speed budget checks",
]

[tool.coverage.run]
branch = true
source = ["fuelroute"]
parallel = true
patch = ["subprocess"]
omit = [
    "*/migrations/*",       # generated by Django
    "*/fuelroute/core/ports.py",  # Protocol classes, imported only for type checking
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "fuelroute"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: web adapters on top, framework-free core at the bottom"
type = "layers"
layers = [
    "fuelroute.api",
    "fuelroute.stations",
    "fuelroute.providers | fuelroute.data",
    "fuelroute.core",
]

[[tool.importlinter.contracts]]
name = "Core, data and providers import no web framework"
type = "forbidden"
source_modules = ["fuelroute.core", "fuelroute.data", "fuelroute.providers"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular"]

[[tool.importlinter.contracts]]
name = "Core does no network I/O"
type = "forbidden"
source_modules = ["fuelroute.core"]
forbidden_modules = ["httpx"]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
